name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist
        env:
          CI: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # public/data/*.json is served to the app via jsDelivr's GitHub CDN
      # (see src/services/config.js) rather than GitHub Pages, since GitHub
      # Pages can't answer a CORS preflight OPTIONS request. jsDelivr caches
      # aggressively (~7 days) by default, so without this, a catalog data
      # change could take up to a week to actually show up in the app.
      - name: Purge jsDelivr cache for public/data
        run: |
          for f in public/data/*.json; do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || true
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
